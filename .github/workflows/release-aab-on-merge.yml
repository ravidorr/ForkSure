name: Release on Merge

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used in step conditions directly; expose only whether signing is configured.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Same for the Google Play upload: the service account JSON itself is only referenced by the upload step.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
    - name: Checkout main
      uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | sed 's/.*= \(.*\)/\1/')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "tag_name=v$VERSION_NAME-build$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Check whether this version is already released
      id: existing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${{ steps.version.outputs.tag_name }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release ${{ steps.version.outputs.tag_name }} already exists, skipping."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Validate Google Play release notes
      if: steps.existing.outputs.exists == 'false' && env.HAS_SIGNING_KEY == 'true' && env.HAS_PLAY_KEY == 'true'
      run: |
        NOTES=distribution/whatsnew/whatsnew-en-US
        if [ ! -s "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
          echo "::error file=$NOTES::Missing or empty Google Play release notes. Update them for this release."
          exit 1
        fi
        LENGTH=$(wc -m < "$NOTES" | tr -d ' ')
        if [ "$LENGTH" -gt 500 ]; then
          echo "::error file=$NOTES::Google Play release notes are $LENGTH characters, the limit is 500."
          exit 1
        fi

    - name: Set up JDK 17
      if: steps.existing.outputs.exists == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create local.properties
      if: steps.existing.outputs.exists == 'false'
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties

    - name: Cache Gradle packages
      if: steps.existing.outputs.exists == 'false'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up release signing
      if: steps.existing.outputs.exists == 'false' && env.HAS_SIGNING_KEY == 'true'
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
        {
          echo "storeFile=release.keystore"
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
        } > keystore.properties

    - name: Build release AAB
      if: steps.existing.outputs.exists == 'false'
      run: |
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Build signed release APK
      if: steps.existing.outputs.exists == 'false' && env.HAS_SIGNING_KEY == 'true'
      run: ./gradlew assembleRelease

    - name: Warn that no APK is published
      if: steps.existing.outputs.exists == 'false' && env.HAS_SIGNING_KEY != 'true'
      run: |
        echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured: publishing the AAB only. An unsigned or debug APK is not distributable."

    - name: Prepare release assets
      if: steps.existing.outputs.exists == 'false'
      run: |
        VERSION="${{ steps.version.outputs.version_name }}"
        mkdir -p release-assets
        cp app/build/outputs/bundle/release/app-release.aab "release-assets/forksure-$VERSION-release.aab"
        if [ "$HAS_SIGNING_KEY" = "true" ]; then
          cp app/build/outputs/apk/release/app-release.apk "release-assets/forksure-$VERSION.apk"
        fi
        cd release-assets
        sha256sum * > checksums.txt

    - name: Create GitHub Release
      if: steps.existing.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version_name }}"
        gh release create "${{ steps.version.outputs.tag_name }}" \
          --target "${{ github.sha }}" \
          --title "ForkSure $VERSION (Build ${{ steps.version.outputs.version_code }})" \
          --generate-notes \
          release-assets/*

    - name: Warn that nothing is uploaded to Google Play
      if: steps.existing.outputs.exists == 'false' && (env.HAS_SIGNING_KEY != 'true' || env.HAS_PLAY_KEY != 'true')
      run: |
        echo "::warning::ANDROID_KEYSTORE_BASE64 or PLAY_SERVICE_ACCOUNT_JSON is not configured: skipping the Google Play upload."

    - name: Locate Google Play upload files
      id: play_files
      if: steps.existing.outputs.exists == 'false' && env.HAS_SIGNING_KEY == 'true' && env.HAS_PLAY_KEY == 'true'
      run: |
        MAPPING=app/build/outputs/mapping/release/mapping.txt
        SYMBOLS=app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
        if [ -f "$MAPPING" ]; then
          echo "mapping=$MAPPING" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No R8 mapping file found, Play will show a missing deobfuscation file warning."
        fi
        # The symbols zip is only produced when the app bundles native libraries.
        if [ -f "$SYMBOLS" ]; then
          echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"
        else
          echo "No native debug symbols produced, uploading without them."
        fi

    # Runs after the GitHub Release exists, so a failed upload fails the job without rolling the release back.
    # Re-runs skip this step because the release already exists. To retry a failed upload, delete the release and tag first.
    - name: Upload to Google Play
      if: steps.existing.outputs.exists == 'false' && env.HAS_SIGNING_KEY == 'true' && env.HAS_PLAY_KEY == 'true'
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.ravidor.forksure
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        # Repo variable PLAY_TRACK overrides the track, for example `internal` for a dry run.
        track: ${{ vars.PLAY_TRACK || 'production' }}
        status: completed
        whatsNewDirectory: distribution/whatsnew
        mappingFile: ${{ steps.play_files.outputs.mapping }}
        debugSymbols: ${{ steps.play_files.outputs.symbols }}
